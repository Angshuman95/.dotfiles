[bar.default]
center = [ "workspaces" ]
end = [
    "media",
    "network_rx",
    "network_tx",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "clock",
    "control-center",
    "session"
]
margin_ends = 0
start = [ "launcher", "wallpaper", "cpu", "temp", "ram" ]
thickness = 32
widget_spacing = 10

[brightness]
enable_ddcutil = true
ignore_mmids = []
minimum_brightness = 0.0
sync_all_monitors = true

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
concave_edge_corners = false
enabled = true
icon_size = 36
position = "left"
reserve_space = false
smart_auto_hide = false

[location]
address = "Kolkata, India"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1536.0
    cy = 1546.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 6000

[shell]
clipboard_history_max_entries = 500

    [shell.launcher]
    app_grid = true

    [shell.panel]
    open_near_click_clipboard = true
    open_near_click_wallpaper = true
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
directory = "/home/angshuman/.config/walls/minimal"

    [wallpaper.default]
    path = "/home/angshuman/.config/walls/minimal/a_flower_on_a_dark_background.png"

    [wallpaper.last]
    path = "/home/angshuman/.config/walls/minimal/a_flower_on_a_dark_background.png"

    [wallpaper.monitors.DP-1]
    path = "/home/angshuman/.config/walls/minimal/a_flower_on_a_dark_background.png"

[widget.clock]
format = "{:%H:%M:%S}"

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.tray]
drawer = true

[widget.workspaces]
focused_output_only = true
